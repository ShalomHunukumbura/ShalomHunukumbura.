name: Update developer tools

# Pulls the tool list from shalomhunukumbura.github.io/tools and rewrites the
# "Developer tools" section of the README. Commits only when something changed.
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python .github/scripts/update_tools.py
      - name: Commit if the README changed
        run: |
          if git diff --quiet README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update developer tools from the tools site"
          git push
